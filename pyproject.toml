[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "release-gate"
version = "0.9.4"
description = "AI agent release decision engine - readiness scoring, regression gate, eval runner, trace validation, and evidence packs for CI/CD."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Vamsi Sudhakaran", email = "vamsi.sudhakaran@gmail.com"}
]
keywords = ["ai", "governance", "cost-control", "safety", "deployment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
# Base install = the CLI only. `pip install release-gate` pulls three small,
# well-audited libraries — no web framework, no database driver, no auth stack.
# This is what a security engineer sees in the dependency tree; the agent
# scanner (the release_gate package) imports none of the SaaS/web deps.
#
# The release-gate.com API (the release_gate_api package) needs the web stack —
# it lives in the `[api]` optional extra below. IMPORTANT: Vercel installs the
# pyproject *base* dependencies (requirements.txt is in .vercelignore), so the
# deploy's Install Command MUST be `pip install .[api]` (pinned in vercel.json)
# or the serverless function crashes on `import fastapi`. Verify with a preview
# deploy after changing this.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "cryptography>=41.0.0",  # evidence-pack signing/verification
]

# Supply-chain note: for reproducible production installs, pin dependencies with
# hashes by running:  pip install release-gate --require-hashes -r requirements.txt
# Generate a pinned requirements file with:  pip-compile --generate-hashes pyproject.toml

[project.optional-dependencies]
dev = [
    # Pull in the full server + MCP stack so the WHOLE test suite runs (the API
    # tests import fastapi/fpdf/psycopg). CI uses `pip install -e .[dev]`.
    "release-gate[api,mcp]",
    "pytest>=9.0",
    "pytest-cov>=4.0",
]
# Optional: expose the auditor as a local MCP server for MCP-capable agents.
# Kept out of the base install so the CLI stays lean.
mcp = [
    "mcp>=1.2",
]
# The release-gate.com SaaS API (release_gate_api). NOT needed to run the CLI.
# Vercel installs this via `pip install .[api]` (see vercel.json). Keeping it out
# of the base install is what makes `pip install release-gate` a lean, three-dep
# CLI a security team can vet quickly.
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "PyJWT>=2.8.0",
    "fpdf2>=2.7.0",  # pure-Python PDF report generation (paid detailed report)
]

[project.scripts]
release-gate = "release_gate.cli:unified_main"
release-gate-mcp = "release_gate.mcp_server:main"

[project.urls]
Homepage = "https://github.com/VamsiSudhakaran1/release-gate"
Documentation = "https://github.com/VamsiSudhakaran1/release-gate#readme"
Repository = "https://github.com/VamsiSudhakaran1/release-gate"
Issues = "https://github.com/VamsiSudhakaran1/release-gate/issues"

[tool.setuptools]
packages = ["release_gate", "release_gate.checks", "release_gate.pricing", "release_gate.crypto", "release_gate.agent", "release_gate.evals"]

[tool.setuptools.package-data]
release_gate = ["*.yaml", "*.json"]

[tool.vercel]
entrypoint = "release_gate_api.main:app"

