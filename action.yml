name: "release-gate"
description: "Admission control for AI systems: one auditable PROMOTE/HOLD/BLOCK from a release's evidence (command: assure), or on the agent-layer risk a pull request introduced (command: pr)."
author: "Vamsi Sudhakaran"

branding:
  icon: "shield"
  color: "blue"

inputs:
  config:
    description: "Path to governance.yaml"
    required: false
    default: "governance.yaml"
  command:
    description: "Command: 'assure' (admission decision over a release's collected evidence), 'pr' (AI-change review gate), 'audit', 'score', 'evidence-pack', 'impact', 'run', or 'loop-sim'"
    required: false
    default: "score"
  base:
    description: "Base ref for 'command: pr' — the branch this PR is merging into (e.g. origin/main). Requires fetch-depth: 0 on checkout."
    required: false
    default: "origin/main"
  scenarios:
    description: "Path to a loop-sim scenarios.yaml (command: loop-sim)"
    required: false
    default: ""
  agent:
    description: "Agent spec for loop-sim (py:module:fn | cmd:./script | http(s)://url). Omit to dry-run with a mock agent."
    required: false
    default: ""
  path:
    description: "Repo path to audit (command: audit). Defaults to the checked-out repo."
    required: false
    default: "."
  evals:
    description: "Path to an evals.yaml of behavior test cases (score / evidence-pack)"
    required: false
    default: ""
  traces:
    description: "Path to an agent execution trace to validate (score / evidence-pack). Accepts release-gate's native format OR a raw Langfuse / OpenTelemetry / Arize-Phoenix export — the platform is auto-detected and converted."
    required: false
    default: ""
  eval-results:
    description: "Path to eval results that ALREADY ran — e.g. `promptfoo eval -o results.json`. release-gate rules on their verdict and never re-grades it. Mutually exclusive with 'evals'."
    required: false
    default: ""
  html-report:
    description: "If set, write an HTML evidence/impact report to this path (e.g. report.html)"
    required: false
    default: ""
  output-evidence:
    description: "If set, write the JSON readiness report to this path"
    required: false
    default: ""
  fail-on-warn:
    description: "Exit with code 1 on WARN as well as FAIL (default: false). For 'assure' it means hold-policy: strict."
    required: false
    default: "false"
  input:
    description: "command: assure — the file stating the release's claims (an assurance envelope), or any one evidence file"
    required: false
    default: ""
  evidence:
    description: "command: assure — more evidence files or directories (every .json/.jsonl/.sarif in one), one per line or comma-separated. Decided over together with 'input' as one case."
    required: false
    default: ""
  methodology:
    description: "command: assure — methodology id@version or a JSON file. Without one the decision is HOLD (METHODOLOGY_REQUIRED)."
    required: false
    default: ""
  candidate:
    description: "command: assure — JSON file naming the exact release (e.g. {\"commit\": \"<sha>\"}). Evidence about another state of it stops supporting its claims."
    required: false
    default: ""
  resolution-policy:
    description: "command: assure — JSON resolution policy file"
    required: false
    default: ""
  org-config:
    description: "command: assure — organisation config file (--config); it can only tighten the bar"
    required: false
    default: ""
  hold-policy:
    description: "command: assure — what HOLD (exit 10) does to this step. 'normal' (default): the step passes with a warning and sets decision=HOLD, so a later job must route the release to a person. 'strict': the step fails, pending approval. BLOCK and errors always fail the step."
    required: false
    default: "normal"
  output-dir:
    description: "command: assure — where the Admission Report (text and JSON), the case and decision.env are written"
    required: false
    default: "release-gate-out"
  artifact-name:
    description: "command: assure — upload output-dir as a workflow artifact under this name; empty to skip"
    required: false
    default: "release-gate-admission"
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  sarif-output:
    description: "If set, write a SARIF 2.1.0 file to this path and upload it to GitHub Code Scanning (e.g. release-gate.sarif)"
    required: false
    default: ""
  pr-comment:
    description: "Post/update a sticky summary comment on the PR (default: false)"
    required: false
    default: "false"
  notify:
    description: "Notification target URL(s): slack://..., datadog://..., otlp://... (comma-separated)"
    required: false
    default: ""

outputs:
  decision:
    description: "PROMOTE/HOLD/BLOCK (assure, audit, pr, loop-sim, score) or PASS/WARN/FAIL (run, impact); ERROR when no decision was reached. A job that deploys must check it: under hold-policy normal a HOLD leaves the step green."
    value: ${{ steps.assure.outputs.decision || steps.audit.outputs.decision || steps.pr.outputs.decision || steps.loop-sim.outputs.decision || steps.gate.outputs.decision }}
  decided-by:
    description: "What reached `decision`: 'admission' for command assure (the release decision over all of a release's evidence, against a declared policy), or the command's own name (audit, pr, score, loop-sim, run, impact), whose decision covers only what that command examines. A job that means to admit a release checks decided-by == 'admission' as well as decision."
    value: ${{ inputs.command == 'assure' && 'admission' || inputs.command }}
  admission-report:
    description: "command: assure — path of the Admission Report JSON"
    value: ${{ steps.assure.outputs.admission-report }}
  audit-score:
    description: "Readiness score 0-100 from the audit command"
  daily-cost:
    description: "Estimated daily cost in USD (from Impact Simulator)"
  runaway-cost:
    description: "Runaway scenario daily cost in USD"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install release-gate
      shell: bash
      # Install the code that ships WITH this Action tag ($GITHUB_ACTION_PATH is
      # the checked-out action source at the pinned ref) — never whatever happens
      # to be latest on PyPI. This guarantees `uses: …@vX.Y.Z` runs the vX.Y.Z CLI,
      # so the Action can't advertise a command the installed package lacks.
      run: pip install "$GITHUB_ACTION_PATH" --quiet

    - name: Run release-gate audit
      if: inputs.command == 'audit'
      id: audit
      shell: bash
      run: |
        set +e
        SARIF_FLAGS=""
        if [ -n "${{ inputs.sarif-output }}" ]; then
          SARIF_FLAGS="--sarif ${{ inputs.sarif-output }}"
        fi
        # First pass: emit pure JSON for downstream steps (PR comment, commit
        # status). This MUST be --json only — combining it with --markdown makes
        # the CLI emit Markdown (which wins), corrupting the file every later
        # `jq` call reads.
        release-gate audit "${{ inputs.path }}" --json \
          > /tmp/rg-audit-report.json 2>/dev/null || true
        # Second pass: human-readable Markdown to the log and the job summary
        # (via $GITHUB_STEP_SUMMARY), plus SARIF if requested. This call owns
        # the real exit code.
        release-gate audit "${{ inputs.path }}" --markdown $SARIF_FLAGS
        EXIT_CODE=$?
        set -e
        # audit exit codes: 0 PROMOTE/no-agent · 10 HOLD · 1 BLOCK
        case "$EXIT_CODE" in
          0) echo "decision=PROMOTE" >> "$GITHUB_OUTPUT" ;;
          10) echo "decision=HOLD" >> "$GITHUB_OUTPUT" ;;
          1) echo "decision=BLOCK" >> "$GITHUB_OUTPUT" ;;
          *) echo "decision=ERROR" >> "$GITHUB_OUTPUT" ;;
        esac
        if [ "$EXIT_CODE" -eq "10" ] && [ "${{ inputs.fail-on-warn }}" != "true" ]; then
          echo "Audit decision: HOLD (allowed — set fail-on-warn: true to block)"
          exit 0
        fi
        exit $EXIT_CODE

    - name: Send notifications
      if: inputs.notify != ''
      shell: bash
      run: |
        IFS=',' read -ra NOTIFY_TARGETS <<< "${{ inputs.notify }}"
        NOTIFY_FLAGS=""
        for target in "${NOTIFY_TARGETS[@]}"; do
          target=$(echo "$target" | xargs)
          if [ -n "$target" ]; then
            NOTIFY_FLAGS="$NOTIFY_FLAGS --notify $target"
          fi
        done
        release-gate audit "${{ inputs.path }}" $NOTIFY_FLAGS --json > /dev/null 2>&1 || true

    - name: Run release-gate loop-sim
      if: inputs.command == 'loop-sim'
      id: loop-sim
      shell: bash
      run: |
        if [ -z "${{ inputs.scenarios }}" ]; then
          echo "::error::command: loop-sim requires a 'scenarios' input (path to scenarios.yaml)"
          exit 1
        fi
        AGENT_FLAG=""
        if [ -n "${{ inputs.agent }}" ]; then
          AGENT_FLAG="--agent ${{ inputs.agent }}"
        fi

        set +e
        release-gate loop-sim "${{ inputs.scenarios }}" $AGENT_FLAG
        EXIT_CODE=$?
        set -e
        case "$EXIT_CODE" in
          0) echo "decision=PROMOTE" >> "$GITHUB_OUTPUT" ;;
          10) echo "decision=HOLD" >> "$GITHUB_OUTPUT" ;;
          1) echo "decision=BLOCK" >> "$GITHUB_OUTPUT" ;;
          *) echo "decision=ERROR" >> "$GITHUB_OUTPUT" ;;
        esac

        # loop-sim exit codes: 0 PROMOTE · 10 HOLD · 1 BLOCK
        if [ "$EXIT_CODE" -eq "10" ] && [ "${{ inputs.fail-on-warn }}" != "true" ]; then
          echo "Loop readiness: HOLD (allowed — set fail-on-warn: true to block)"
          exit 0
        fi
        exit $EXIT_CODE

    - name: Run release-gate pr (AI-change review gate)
      if: inputs.command == 'pr'
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        # One PROMOTE/HOLD/BLOCK on what THIS diff introduced. --comment emits
        # GitHub-flavored markdown; we show it in the job summary and (optionally)
        # post it as a sticky PR comment.
        release-gate pr --base "${{ inputs.base }}" --comment > /tmp/rg-pr.md
        EXIT_CODE=$?
        set -e
        case "$EXIT_CODE" in
          0) echo "decision=PROMOTE" >> "$GITHUB_OUTPUT" ;;
          10) echo "decision=HOLD" >> "$GITHUB_OUTPUT" ;;
          1) echo "decision=BLOCK" >> "$GITHUB_OUTPUT" ;;
          *) echo "decision=ERROR" >> "$GITHUB_OUTPUT" ;;
        esac
        cat /tmp/rg-pr.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
        cat /tmp/rg-pr.md

        # Sticky PR comment (create or update) when requested on a pull_request event.
        if [ "${{ inputs.pr-comment }}" = "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
          BODY="<!-- release-gate-pr -->"$'\n'"$(cat /tmp/rg-pr.md)"
          CID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- release-gate-pr -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$CID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${CID}" -X PATCH -f "body=${BODY}" --silent || true
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f "body=${BODY}" --silent || true
          fi
        fi

        # Exit codes: 0 PROMOTE · 10 HOLD · 1 BLOCK. HOLD is "mergeable after a
        # human looks" — only fail the check on it when fail-on-warn is set.
        if [ "$EXIT_CODE" -eq "10" ] && [ "${{ inputs.fail-on-warn }}" != "true" ]; then
          echo "release-gate pr: HOLD (allowed — set fail-on-warn: true to block on HOLD)"
          exit 0
        fi
        exit $EXIT_CODE

    - name: Run release-gate assure (admission decision)
      if: inputs.command == 'assure'
      id: assure
      shell: bash
      # Inputs reach the script as environment variables, never spliced into it.
      env:
        RELEASE_GATE_INPUT: ${{ inputs.input }}
        RELEASE_GATE_EVIDENCE: ${{ inputs.evidence }}
        RELEASE_GATE_METHODOLOGY: ${{ inputs.methodology }}
        RELEASE_GATE_CANDIDATE: ${{ inputs.candidate }}
        RELEASE_GATE_RESOLUTION_POLICY: ${{ inputs.resolution-policy }}
        RELEASE_GATE_CONFIG: ${{ inputs.org-config }}
        RELEASE_GATE_HOLD_POLICY: ${{ inputs.fail-on-warn == 'true' && 'strict' || inputs.hold-policy }}
        RELEASE_GATE_OUT: ${{ inputs.output-dir }}
      run: |
        # One admission decision over everything the pipeline collected.
        # Exit codes are the CLI's: 0 PROMOTE · 10 HOLD · 1 BLOCK. HOLD is not
        # BLOCK: under hold-policy normal it passes this step and sets
        # decision=HOLD for a later job to route to a person; under strict it
        # fails the step pending approval. Anything that is not a decision the
        # Admission Report confirms is ERROR, and fails.
        out="${RELEASE_GATE_OUT:-release-gate-out}"
        policy="${RELEASE_GATE_HOLD_POLICY:-normal}"
        fail() { echo "decision=ERROR" >> "$GITHUB_OUTPUT"; echo "::error title=release-gate::$1"; exit 1; }
        case "$policy" in normal|strict) ;; *) fail "hold-policy must be normal or strict, not '$policy'" ;; esac
        [ -n "${RELEASE_GATE_INPUT:-}" ] || fail "command: assure needs an 'input' file"
        mkdir -p "$out"
        rm -f "$out/admission-report.json" "$out/admission-report.txt" "$out/case.json" "$out/decision.env"
        args=("$RELEASE_GATE_INPUT")
        while IFS= read -r item; do
          item="$(printf '%s' "$item" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -n "$item" ]; then args+=(--evidence "$item"); fi
        done < <(printf '%s\n' "${RELEASE_GATE_EVIDENCE:-}" | tr ',' '\n')
        if [ -n "${RELEASE_GATE_METHODOLOGY:-}" ]; then args+=(--methodology "$RELEASE_GATE_METHODOLOGY"); fi
        if [ -n "${RELEASE_GATE_CANDIDATE:-}" ]; then args+=(--candidate "$RELEASE_GATE_CANDIDATE"); fi
        if [ -n "${RELEASE_GATE_RESOLUTION_POLICY:-}" ]; then args+=(--resolution-policy "$RELEASE_GATE_RESOLUTION_POLICY"); fi
        if [ -n "${RELEASE_GATE_CONFIG:-}" ]; then args+=(--config "$RELEASE_GATE_CONFIG"); fi
        code=0
        release-gate assure "${args[@]}" --admission \
          --admission-out "$out/admission-report.json" --case-output "$out/case.json" \
          > "$out/admission-report.txt" 2>&1 || code=$?
        cat "$out/admission-report.txt"
        reported="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' "$out/admission-report.json" 2>/dev/null || echo NONE)"
        case "$code:$reported" in
          0:PROMOTE) decision=PROMOTE ;;
          10:HOLD) decision=HOLD ;;
          1:BLOCK) decision=BLOCK ;;
          *) decision=ERROR ;;
        esac
        echo "RELEASE_GATE_DECISION=$decision" > "$out/decision.env"
        echo "decision=$decision" >> "$GITHUB_OUTPUT"
        echo "admission-report=$out/admission-report.json" >> "$GITHUB_OUTPUT"
        {
          echo "## Admission decision: $decision"
          echo
          echo '```'
          cat "$out/admission-report.txt"
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        case "$decision" in
          PROMOTE) exit 0 ;;
          HOLD)
            if [ "$policy" = "strict" ]; then
              echo "::error title=release-gate HOLD::held under hold-policy strict: stopped pending approval"
              exit 1
            fi
            echo "::warning title=release-gate HOLD::a person must review this release before it deploys (decision=HOLD)"
            exit 0 ;;
          BLOCK) echo "::error title=release-gate BLOCK::this release is not admitted"; exit 1 ;;
          *) echo "::error title=release-gate::no admission decision was reached (exit $code, report: $reported)"; exit 1 ;;
        esac

    - name: Upload the Admission Report
      if: inputs.command == 'assure' && inputs.artifact-name != '' && always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output-dir }}
        if-no-files-found: warn

    - name: Run release-gate ${{ inputs.command }}
      if: inputs.command != 'audit' && inputs.command != 'loop-sim' && inputs.command != 'pr' && inputs.command != 'assure'
      id: gate
      shell: bash
      run: |
        EXTRA_FLAGS=""
        if [ -n "${{ inputs.evals }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --evals ${{ inputs.evals }}"
        fi
        if [ -n "${{ inputs.traces }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --traces ${{ inputs.traces }}"
        fi
        if [ -n "${{ inputs.eval-results }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --eval-results ${{ inputs.eval-results }}"
        fi
        if [ -n "${{ inputs.html-report }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --html-report ${{ inputs.html-report }}"
        fi
        if [ -n "${{ inputs.output-evidence }}" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --output-evidence ${{ inputs.output-evidence }}"
        fi

        set +e
        release-gate ${{ inputs.command }} ${{ inputs.config }} $EXTRA_FLAGS
        EXIT_CODE=$?
        set -e
        case "${{ inputs.command }}:$EXIT_CODE" in
          run:0|impact:0) echo "decision=PASS" >> "$GITHUB_OUTPUT" ;;
          run:10|impact:10) echo "decision=WARN" >> "$GITHUB_OUTPUT" ;;
          run:1|impact:1) echo "decision=FAIL" >> "$GITHUB_OUTPUT" ;;
          *:0) echo "decision=PROMOTE" >> "$GITHUB_OUTPUT" ;;
          *:10) echo "decision=HOLD" >> "$GITHUB_OUTPUT" ;;
          *:1) echo "decision=BLOCK" >> "$GITHUB_OUTPUT" ;;
          *) echo "decision=ERROR" >> "$GITHUB_OUTPUT" ;;
        esac

        # Exit code 10 = WARN. Treat as failure only if fail-on-warn is true.
        if [ "$EXIT_CODE" -eq "10" ] && [ "${{ inputs.fail-on-warn }}" != "true" ]; then
          echo "Decision: WARN (allowed — set fail-on-warn: true to block)"
          exit 0
        fi
        exit $EXIT_CODE

    - name: Upload HTML report
      if: inputs.html-report != '' && always()
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      with:
        name: release-gate-report
        path: ${{ inputs.html-report }}

    - name: Upload SARIF to GitHub Code Scanning
      if: inputs.sarif-output != '' && inputs.command == 'audit' && always()
      uses: github/codeql-action/upload-sarif@df5a14dc28094dc936e103b37d749c6628682b60 # v3.25.0
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: release-gate

    - name: Post PR comment
      if: inputs.pr-comment == 'true' && github.event_name == 'pull_request' && inputs.command == 'audit' && always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Parse JSON report for summary data
        SCORE=$(jq -r '.score // "?"' /tmp/rg-audit-report.json 2>/dev/null || echo "?")
        DECISION=$(jq -r '.decision // "UNKNOWN"' /tmp/rg-audit-report.json 2>/dev/null || echo "UNKNOWN")
        FINDINGS=$(jq -r '.code_findings | length' /tmp/rg-audit-report.json 2>/dev/null || echo "0")
        MISSING=$(jq -r '.missing | length' /tmp/rg-audit-report.json 2>/dev/null || echo "?")
        PASSING=$(jq -r '.passing | length' /tmp/rg-audit-report.json 2>/dev/null || echo "?")

        case "$DECISION" in
          PROMOTE) BADGE="🟢 PROMOTE" ;;
          HOLD)    BADGE="🟡 HOLD" ;;
          BLOCK)   BADGE="🔴 BLOCK" ;;
          *)       BADGE="⚪ $DECISION" ;;
        esac

        RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        # Build safeguard table rows from JSON
        SG_ROWS=$(jq -r '
          (.passing // [] | map("| " + .label + " | ✅ | " + (.evidence // "—") + " |")) +
          (.missing // [] | map("| " + .label + " | ❌ | " + ((.issues // [.risk] // []) | map(select(. != null)) | first // "—") + " |"))
          | .[]' /tmp/rg-audit-report.json 2>/dev/null || echo "| — | — | — |")

        BODY="<!-- release-gate -->\n## 🚪 release-gate\n\n**Score:** ${SCORE}/100 — ${BADGE}\n\n| Safeguard | Status | Detail |\n| --- | :---: | --- |\n${SG_ROWS}\n\n**Code risks:** ${FINDINGS} finding(s)  \n[Full run →](${RUN_URL})"

        # Find existing comment from this bot
        COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
          --jq '.[] | select(.body | startswith("<!-- release-gate -->")) | .id' 2>/dev/null | head -1)

        if [ -n "$COMMENT_ID" ]; then
          gh api "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
            -X PATCH -f "body=${BODY}" --silent
        else
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -f "body=${BODY}" --silent
        fi

    - name: Set commit status
      if: inputs.command == 'audit' && always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SCORE=$(jq -r '.score // "?"' /tmp/rg-audit-report.json 2>/dev/null || echo "?")
        DECISION=$(jq -r '.decision // "UNKNOWN"' /tmp/rg-audit-report.json 2>/dev/null || echo "UNKNOWN")
        case "$DECISION" in
          PROMOTE) STATE="success" ;;
          HOLD)    STATE="pending" ;;
          BLOCK)   STATE="failure" ;;
          *)       STATE="error" ;;
        esac
        DESC="Score: ${SCORE}/100 — ${DECISION}"
        SHA="${{ github.event.pull_request.head.sha || github.sha }}"
        REPO="${{ github.repository }}"
        gh api "repos/${REPO}/statuses/${SHA}" \
          -f state="${STATE}" \
          -f context="release-gate / readiness" \
          -f description="${DESC}" \
          -f target_url="${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }}" \
          --silent || true
