      subprocess.run(['git', 'clone', url])

  - id: exec-context-not-text-clean
    lang: py
    label: clean
    expect: []
    source: "token-based hints: 'context' must not match 'text', 'database' not 'data'"
    code: |
      import openai
      def f(context, database):
          eval(context)
          os.system(database)

  # Honest limitations — kept in the corpus on purpose (precision-first design).
  - id: exec-cross-function-taint-interprocedural
    lang: py
    label: vulnerable
    expect: [RG-EXEC-001]
    source: "Was a KNOWN MISS until 0.9.4: taint now follows a local helper's return across the call boundary, citing the origin line INSIDE the helper"
    code: |
      def get_cmd(request):
          return request.data
      def run(request):
          c = get_cmd(request)
          eval(c)

