  # ── RG-EXEC-001 — HMAC-guard-clause deser + compile-for-validation (langflow) ─
  - id: exec-hmac-guard-clause-dill-clean
    lang: py
    label: clean
    expect: []
    source: "langflow services/cache/service.py — dill.loads gated by an `if not hmac.compare_digest(...): return` clause in the same function (HMAC-signed Redis cache)"
    code: |
      import dill, hmac
      async def get(self, key):
          value = await self._client.get(key)
          tag, payload = value[:32], value[32:]
          expected = self._integrity_tag(key, payload)
          if not hmac.compare_digest(tag, expected):
              return CACHE_MISS
          return dill.loads(payload)

