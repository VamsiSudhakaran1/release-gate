  - id: parse001-model-json-guarded-clean
    lang: py
    label: clean
    expect: []
    source: "the CORRECT pattern — the parse is wrapped in try/except"
    code: |
      from openai import OpenAI
      c = OpenAI()
      import json
      def go(m):
