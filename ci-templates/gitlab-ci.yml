# release-gate audit on every merge request. For the full admission pipeline
# (evals, scanners and approvals decided together before deploy) see
# admission/gitlab-ci.yml.
#
# Exit codes: 0 PROMOTE · 10 HOLD · 1 BLOCK. HOLD is not BLOCK: it needs a
# person, so the job passes with a warning (allow_failure on exit 10). To stop
# on HOLD as well, delete the allow_failure block.
release-gate:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install release-gate --quiet
  script:
    - release-gate audit . --sarif release-gate.sarif
  allow_failure:
    exit_codes: [10]
  artifacts:
    when: always
    reports:
      sast: release-gate.sarif
    paths:
      - release-gate.sarif
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
