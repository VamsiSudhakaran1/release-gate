name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install release-gate with dev dependencies
        run: pip install -e ".[dev]"

      - name: Check version consistency (site/docs/package vs pyproject)
        run: python scripts/check_version_sync.py

      - name: Run tests
        run: pytest tests/ --ignore=tests/test_crypto.py -v --tb=short

      - name: Accuracy benchmark (precision floor + HIGH-tier integrity)
        run: python benchmark/run.py

      - name: Reproduce the published demo (asserts every claim in the docs)
        # The demo is the first thing a stranger runs. If the engine's output
        # drifts from what README/demo.html quote, this fails the build rather
        # than letting the published demo quietly become a mockup.
        run: ./examples/demo-code-risk/build_demo.sh --check

      - name: Run Impact Simulator demo (safe)
        run: release-gate impact examples/governance-safe-pass.yaml

      - name: Run Impact Simulator demo (unsafe — expect BLOCK exit code)
        run: |
          set +e
          release-gate impact examples/governance-unsafe-fail.yaml
          EXIT=$?
          # BLOCK = exit code 1, which is expected for this demo
          if [ "$EXIT" -eq "0" ]; then
            echo "ERROR: unsafe config should have been blocked"
            exit 1
          fi
          echo "Correctly blocked unsafe deployment (exit $EXIT)"
